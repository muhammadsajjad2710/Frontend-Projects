<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue Star Rating</title>
  <meta name="generator" content="Vue">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Vue</p>
    <h1>Vue Star Rating</h1>
    <p class="lede">Click stars to set a rating.</p>
    <div id="app"><div class="stars"><button v-for="n in 5" :key="n" type="button" @click="value=n">{{ n<=value ? "★" : "☆" }}</button></div><p class="status">Rating {{ value }} / 5</p></div>
  </main>
  
<script>
const {createApp,ref}=Vue; createApp({setup(){ return {value:ref(3)}; }}).mount('#app');
</script>
</body>
</html>
