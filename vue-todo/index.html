<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue Todo</title>
  <meta name="generator" content="Vue">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Vue</p>
    <h1>Vue Todo</h1>
    <p class="lede">A todo list with Vue 3 from a CDN.</p>
    <div id="app"><form class="row" @submit.prevent="add"><input v-model="title" placeholder="Task"><button>Add</button></form><ul class="list"><li v-for="(t,i) in tasks" :key="i"><span>{{ t.done ? t.title + " (done)" : t.title }}</span><button class="secondary" type="button" @click="t.done=!t.done">Toggle</button></li></ul></div>
  </main>
  
<script>
const {createApp,ref}=Vue; createApp({setup(){ const title=ref(''); const tasks=ref([]); const add=()=>{ if(!title.value.trim()) return; tasks.value.push({title:title.value,done:false}); title.value=''; }; return {title,tasks,add}; }}).mount('#app');
</script>
</body>
</html>
