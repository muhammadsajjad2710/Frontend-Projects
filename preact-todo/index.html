<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preact Todo</title>
  <meta name="generator" content="Preact">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Preact</p>
    <h1>Preact Todo</h1>
    <p class="lede">Todos with Preact and htm, no JSX build.</p>
    <div id="root"></div>
  </main>
  <script src="https://unpkg.com/preact@10.24.3/dist/preact.min.js"></script><script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<script>

const {h, render} = preact; const html = htm.bind(h);
const state = { title:"", tasks:[] };
function paint(){
  render(html`<div>
    <form class="row" onSubmit=${e=>{e.preventDefault(); if(!state.title.trim()) return; state.tasks.push({title:state.title,done:false}); state.title=""; paint();}}>
      <input value=${state.title} onInput=${e=>{state.title=e.target.value;}} placeholder="Task"/>
      <button>Add</button>
    </form>
    <ul class="list">${state.tasks.map((t,i)=>html`<li key=${i}><span>${t.done?t.title+" (done)":t.title}</span><button class="secondary" type="button" onClick=${()=>{t.done=!t.done; paint();}}>Toggle</button></li>`)}</ul>
  </div>`, document.getElementById("root"));
}
paint();

</script>
</body>
</html>
