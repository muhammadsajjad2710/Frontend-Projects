<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <meta name="generator" content="Vanilla JS">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Vanilla JS</p>
    <h1>Expense Tracker</h1>
    <p class="lede">Add expenses and see a running total.</p>
    <form id="form" class="row"><input id="label" required placeholder="Item"><input id="amount" type="number" min="1" required placeholder="Amount"><button type="submit">Add</button></form><ul id="list" class="list"></ul><p id="total" class="status">Total 0</p>
  </main>
  
<script>

const rows=[]; const list=document.getElementById("list");
function render(){ while(list.firstChild) list.removeChild(list.firstChild); let sum=0;
  rows.forEach(r=>{ sum+=r.amount; const li=document.createElement("li"); li.textContent=r.label+" — "+r.amount; list.appendChild(li); });
  document.getElementById("total").textContent="Total "+sum; }
document.getElementById("form").addEventListener("submit",(e)=>{ e.preventDefault(); rows.push({label:document.getElementById("label").value, amount:Number(document.getElementById("amount").value)}); e.target.reset(); render(); });

</script>
</body>
</html>
